<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Loan Eligibility Checker</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        margin: 0;
        padding: 30px;
    }

    .container {
        max-width: 750px;
        margin: auto;
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
        text-align: center;
        color: #003366;
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #333;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 16px;
    }

    button {
        width: 100%;
        padding: 14px;
        background: #0056b3;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #004494;
    }

    .result {
        display: none;
        margin-top: 25px;
        background: #eef5ff;
        padding: 20px;
        border-left: 5px solid #0056b3;
        border-radius: 6px;
    }

    .amount {
        font-size: 28px;
        font-weight: bold;
        color: #0056b3;
        margin: 10px 0;
    }

    .apply-btn {
        display: inline-block;
        margin-top: 15px;
        padding: 12px 20px;
        background: #28a745;
        color: white;
        text-decoration: none;
        border-radius: 6px;
    }

    .apply-btn:hover {
        background: #218838;
    }
</style>
</head>

<body>

<div class="container">

    <h1>Home Loan Eligibility Checker</h1>

    <div class="form-group">
        <label>Monthly Income (₹)</label>
        <input type="number" id="income" placeholder="100000">
    </div>

    <div class="form-group">
        <label>Existing Monthly EMIs (₹)</label>
        <input type="number" id="obligations" placeholder="15000">
    </div>

    <div class="form-group">
        <label>Interest Rate (% p.a.)</label>
        <input type="number" id="rate" value="8.5" step="0.01">
    </div>

    <div class="form-group">
        <label>Loan Tenure (Years)</label>
        <input type="number" id="tenure" value="20">
    </div>

    <button onclick="calculateEligibility()">
        Check Eligibility
    </button>

    <div id="result" class="result">

        <h2>Your Eligibility Result</h2>

        <p><strong>Maximum Affordable EMI</strong></p>
        <div class="amount" id="emiAmount"></div>

        <p><strong>Estimated Eligible Loan Amount</strong></p>
        <div class="amount" id="loanAmount"></div>

        <p id="message"></p>

        " class="apply-btn">
            Apply for Home Loan
        </a>

    </div>

</div>

<script>

function calculateEligibility() {

    const income =
        parseFloat(document.getElementById("income").value) || 0;

    const obligations =
        parseFloat(document.getElementById("obligations").value) || 0;

    const rate =
        parseFloat(document.getElementById("rate").value) || 8.5;

    const tenureYears =
        parseFloat(document.getElementById("tenure").value) || 20;

    const maxEMI = (income * 0.50) - obligations;

    if (maxEMI <= 0) {
        alert("Please enter valid income and EMI details.");
        return;
    }

    const monthlyRate = rate / (12 * 100);
    const totalMonths = tenureYears * 12;

    const eligibleLoan =
        maxEMI *
        ((Math.pow(1 + monthlyRate, totalMonths) - 1) /
        (monthlyRate * Math.pow(1 + monthlyRate, totalMonths)));

    document.getElementById("emiAmount").innerHTML =
        "₹ " + Math.round(maxEMI).toLocaleString("en-IN");

    document.getElementById("loanAmount").innerHTML =
        "₹ " + Math.round(eligibleLoan).toLocaleString("en-IN");

    document.getElementById("message").innerHTML =
        "Based on the information provided, this is an estimated loan amount you may be eligible for. Final approval is subject to income verification, credit assessment, and lending policy.";

    document.getElementById("result").style.display = "block";
}

</script>

</body>
</html>
